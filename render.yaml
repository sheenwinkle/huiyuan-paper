services:
  - type: web
    name: huiyuan-paper-web
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run db:generate && npx prisma migrate deploy && node prisma/seed.js && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: huiyuan-paper-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: rules
      - key: DEMO_MODE
        value: "false"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

databases:
  - name: huiyuan-paper-db
    plan: free
    region: singapore
    databaseName: huiyuan_paper
    user: huiyuan_paper
