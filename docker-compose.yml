services:
  postgres:
    image: postgres:16-alpine
    container_name: huiyuan-paper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: huiyuan_paper
    ports:
      - "5432:5432"
    volumes:
      - huiyuan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d huiyuan_paper"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  huiyuan_postgres_data:

